
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Dream House</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <script>

        // Change the ball colour when clicked
        AFRAME.registerComponent('color-changer', {
            init: function () {

                const colors = [
                    '#FF5252',
                    '#FFD740',
                    '#40C4FF',
                    '#69F0AE',
                    '#E040FB'
                ];

                let index = 0;

                this.el.addEventListener('click', () => {

                    index = (index + 1) % colors.length;

                    this.el.setAttribute(
                        'material',
                        'color',
                        colors[index]
                    );

                    document.querySelector('#interaction-status')
                        .textContent = 'Ball colour changed!';

                });
            }
        });


        // Grow and shrink the tree when clicked
        AFRAME.registerComponent('tree-grow', {
            init: function () {

                let grown = false;

                this.el.addEventListener('click', () => {

                    grown = !grown;

                    if (grown) {
                        this.el.setAttribute('scale', '1.5 1.5 1.5');
                    } else {
                        this.el.setAttribute('scale', '1 1 1');
                    }

                    document.querySelector('#interaction-status')
                        .textContent = grown
                            ? 'Tree grew bigger!'
                            : 'Tree returned to normal!';

                });
            }
        });


        // Update marker detection banner
        AFRAME.registerComponent('marker-status', {
            init: function () {

                const banner = document.querySelector('#status');

                this.el.addEventListener('markerFound', () => {
                    banner.textContent =
                        'Marker Found! Welcome to My Dream House!';
                    banner.style.background = '#2E7D32';
                });

                this.el.addEventListener('markerLost', () => {
                    banner.textContent =
                        'Marker Lost! Please scan the Hiro marker.';
                    banner.style.background = '#C62828';
                });

            }
        });

    </script>

    <style>

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #status {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            padding: 15px;
            text-align: center;
            color: white;
            background: #C62828;
            font-size: 16px;
            font-weight: bold;
        }

        #interaction-status {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
        }

    </style>

</head>

<body>

    <!-- Marker Status -->
    <div id="status">
        Looking for Hiro marker...
    </div>

    <!-- Interaction Status -->
    <div id="interaction-status">
        Click the ball or the left tree!
    </div>


    <!-- AR Scene -->
    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;">


        <!-- Load House Model -->
        <a-assets timeout="20000">
            <a-asset-item
                id="house-model"
                src="models/house.glb">
            </a-asset-item>
        </a-assets>


        <!-- Hiro Marker -->
        <a-marker
            preset="hiro"
            marker-status>


            <!-- Green Garden -->
            <a-plane
                position="0 0 0"
                rotation="-90 0 0"
                width="2"
                height="2"
                color="#7BC67B">
            </a-plane>


            <!-- Garden Path -->
            <a-box
                position="0 0.02 0.65"
                width="0.3"
                height="0.04"
                depth="0.7"
                color="#D7CCC8">
            </a-box>


            <!-- Small 3D House -->
            <a-entity
                gltf-model="#house-model"
                position="0 0 -0.18"
                scale="0.08 0.08 0.08">
            </a-entity>


            <!-- Left Tree Trunk -->
            <a-cylinder
                position="-0.7 0.25 0"
                radius="0.08"
                height="0.5"
                color="#795548">
            </a-cylinder>


            <!-- Left Tree Leaves - Clickable -->
            <a-sphere
                class="clickable"
                tree-grow
                position="-0.7 0.65 0"
                radius="0.3"
                color="#2E7D32">
            </a-sphere>


            <!-- Right Tree Trunk -->
            <a-cylinder
                position="0.7 0.25 0"
                radius="0.08"
                height="0.5"
                color="#795548">
            </a-cylinder>


            <!-- Right Tree Leaves -->
            <a-sphere
                position="0.7 0.65 0"
                radius="0.3"
                color="#388E3C">
            </a-sphere>


            <!-- Bouncing Ball - Larger and Slower -->
            <a-sphere
                class="clickable"
                color-changer
                position="0.55 0.3 0.65"
                radius="0.22"
                color="#FF5252"

                animation="
                    property: position;
                    from: 0.55 0.3 0.65;
                    to: 0.55 0.5 0.65;
                    dir: alternate;
                    dur: 2000;
                    easing: easeInOutQuad;
                    loop: true">
            </a-sphere>


            <!-- Rotating Yellow Cube -->
            <a-box
                position="-0.5 0.3 0.65"
                width="0.2"
                height="0.2"
                depth="0.2"
                color="#FFD54F"

                animation="
                    property: rotation;
                    from: 0 0 0;
                    to: 0 360 0;
                    dur: 4000;
                    easing: linear;
                    loop: true">
            </a-box>


            <!-- Main Title -->
            <a-text
                value="MY DREAM HOUSE"
                position="0 1.5 0"
                align="center"
                width="3"
                color="#FFFFFF">
            </a-text>


            <!-- Instructions -->
            <a-text
                value="Tap the ball and tree!"
                position="0 1.25 0"
                align="center"
                width="2"
                color="#FFFF00">
            </a-text>


        </a-marker>


        <!-- Camera and Mouse Interaction -->
        <a-entity
            camera
            cursor="rayOrigin: mouse; fuse: false"
            raycaster="objects: .clickable; far: 100">
        </a-entity>


    </a-scene>

</body>

</html>
